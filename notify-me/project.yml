name: AYFM
options:
  bundleIdPrefix: com.ayfm
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: FLY4PRP79P
    CODE_SIGN_STYLE: Automatic

schemes:
  AYFM:
    build:
      targets:
        AYFM: all
        AYFMWidgetExtension: all
        AYFMShareExtension: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release

targets:
  AYFM:
    type: application
    platform: iOS
    sources:
      - path: AYFM
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - target: AYFMWidgetExtension
      - target: AYFMShareExtension
      - framework: AppIntents.framework
        embed: false
      - framework: ActivityKit.framework
        embed: false
    info:
      path: AYFM/Info.plist
      properties:
        CFBundleDisplayName: AYFM
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: kud.remindreply
            CFBundleURLSchemes:
              - ayfm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kud.remindreply
        CODE_SIGN_ENTITLEMENTS: AYFM/AYFM.entitlements

  AYFMWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: AYFMWidgetExtension
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - framework: WidgetKit.framework
        embed: false
      - framework: ActivityKit.framework
        embed: false
      - framework: AppIntents.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kud.remindreply.widget-extension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AYFMWidgetExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: AYFMWidgetExtension/AYFMWidgetExtension.entitlements

  AYFMShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: AYFMShareExtension
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kud.remindreply.share-extension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AYFMShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: AYFMShareExtension/AYFMShareExtension.entitlements
