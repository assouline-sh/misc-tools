name: NotifyMe
options:
  bundleIdPrefix: com.notifyme
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: FLY4PRP79P
    CODE_SIGN_STYLE: Automatic

schemes:
  NotifyMe:
    build:
      targets:
        NotifyMe: all
        NotifyMeWidgetExtension: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release

targets:
  NotifyMe:
    type: application
    platform: iOS
    sources:
      - path: NotifyMe
      - path: Shared
    dependencies:
      - target: NotifyMeWidgetExtension
      - framework: AppIntents.framework
        embed: false
      - framework: ActivityKit.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kud.remindreply
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AYFM
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        CODE_SIGN_ENTITLEMENTS: NotifyMe/NotifyMe.entitlements

  NotifyMeWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: NotifyMeWidgetExtension
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - framework: WidgetKit.framework
        embed: false
      - framework: ActivityKit.framework
        embed: false
      - framework: AppIntents.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kud.remindreply.widget-extension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NotifyMeWidgetExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotifyMeWidgetExtension/NotifyMeWidgetExtension.entitlements
