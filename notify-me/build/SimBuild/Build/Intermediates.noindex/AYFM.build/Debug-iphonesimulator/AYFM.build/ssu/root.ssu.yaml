apiVersion: ssu/v1
nlu:
  shortcuts:
    bundleIdentifier: kud.remindreply
    intents:
    - metadata:
        name: CreateReminderIntent_0
        title: Track a Reply Reminder
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Track a reply in ${+applicationName}'
          - '{${+prefix} }Remind me to reply in ${+applicationName}'
          - '{${+prefix} }${+applicationName} remind me to reply'
    - metadata:
        name: +negative
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }${+standardAppShortcutNegatives}'
variables:
- name: +applicationName
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
    - AYFM
- name: +prefix
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/prefix/en.yaml
- name: +standardAppShortcutNegatives
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/standardAppShortcutNegatives/en.yaml
